name: iroh-ssh

on:
  workflow_dispatch:

permissions: {}

jobs:
  ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install iroh-ssh
        run: |
          cargo install iroh-ssh
          iroh-ssh version

      - name: get keys
        env:
          ACTOR: ${{ github.actor }}
        run: |
          mkdir ~/.ssh
          curl https://github.com/${ACTOR}.keys >> ~/.ssh/authorized_keys
          cat ~/.ssh/authorized_keys

      - name: run sshd
        run: |
          iroh-ssh server
